<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ရွှေဗေဒင် — ဗေဒင်မေးခန်း</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="app.js"></script>
<script>
"use strict";
const history = [];
function init() {
  document.getElementById("app").innerHTML = headerHTML("ask.html") + `
    <div class="hero" style="padding-top:22px">
      <div class="halo" style="width:84px;height:84px;font-size:40px">💬</div>
      <h2 class="gold-text"><span data-i18n="ask_title">${t("ask_title")}</span><span class="beta-badge" data-i18n="advice_beta">${t("advice_beta")}</span></h2>
      <p data-i18n="ask_sub">${t("ask_sub")}</p>
    </div>
    ${keyWarningHTML()}
    <div class="chat" id="chat"></div>
    <div class="chatbar">
      <input type="text" id="msg" data-i18n-ph="ask_ph" placeholder="${t("ask_ph")}" autocomplete="off">
      <button class="btn" id="send" data-i18n="send">${t("send")}</button>
    </div>
    <p class="error" id="err" hidden></p>
  ` + footerHTML();
  applyI18n();
  document.querySelectorAll(".lang-toggle button").forEach((b) => (b.onclick = () => { setLang(b.dataset.lang); location.reload(); }));
  checkKey();
  const chat = document.getElementById("chat");
  const err = document.getElementById("err");
  addMsg("bot", getLang() === "my"
    ? "မင်္ဂလာပါ 🙏 ကျွန်ုပ်က ရွှေဗေဒင်ဆရာကြီးပါ။ အချစ်၊ အလုပ်၊ ကျန်းမာရေး၊ ကံကြမ္မာ — သိချင်တာမေးလိုက်ပါ။"
    : "Mingalaba 🙏 I am the Shwe Baydin master astrologer. Ask me about love, career, health or fortune.");
  const send = async () => {
    err.hidden = true;
    const inp = document.getElementById("msg");
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    addMsg("user", text);
    history.push({ role: "user", text });
    const typing = addMsg("bot", t("loading"));
    typing.classList.add("typing");
    try {
      const d = await api("/api/ask", {
        method: "POST",
        body: JSON.stringify({ message: text, history: history.slice(-6) }),
      });
      typing.classList.remove("typing");
      typing.textContent = d.reply;
      history.push({ role: "assistant", text: d.reply });
    } catch (e) {
      typing.remove();
      err.hidden = false;
      err.textContent = e.code === "rate-limit" ? t("rate") : e.code === "no-key" ? t("need_key") : t("err");
    }
  };
  document.getElementById("send").onclick = send;
  document.getElementById("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  function addMsg(who, text) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
