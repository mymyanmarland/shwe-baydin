<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120" role="img" aria-label="animated gold wave divider">
  <defs>
    <linearGradient id="wvg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .w1 { animation: slide 9s linear infinite; }
    .w2 { animation: slide 15s linear infinite reverse; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-320px); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    .tw2 { animation: tw 4.2s ease-in-out infinite; animation-delay: -1.6s; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    .glowp { animation: glowp 5s ease-in-out infinite; }
    @keyframes glowp { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
  </style>

  <circle class="glowp" cx="640" cy="46" r="90" fill="url(#fglow)"/>

  <g>
    <g class="w1">
      <path d="M0,70 C80,50 160,50 240,70 C320,90 400,90 480,70 C560,50 640,50 720,70 C800,90 880,90 960,70 C1040,50 1120,50 1200,70 C1280,90 1360,90 1440,70 L1440,120 L0,120 Z" fill="url(#wvg)" opacity="0.3"/>
      <path d="M-320,70 C-240,50 -160,50 -80,70 C0,90 80,90 160,70 C240,50 320,50 400,70 C480,90 560,90 640,70 C720,50 800,50 880,70 C960,90 1040,90 1120,70 L1120,120 L-320,120 Z" fill="url(#wvg)" opacity="0.3"/>
    </g>
    <g class="w2">
      <path d="M0,88 C80,72 160,72 240,88 C320,104 400,104 480,88 C560,72 640,72 720,88 C800,104 880,104 960,88 C1040,72 1120,72 1200,88 C1280,104 1360,104 1440,88 L1440,120 L0,120 Z" fill="url(#wvg)" opacity="0.5"/>
      <path d="M-320,88 C-240,72 -160,72 -80,88 C0,104 80,104 160,88 C240,72 320,72 400,88 C480,104 560,104 640,88 C720,72 800,72 880,88 C960,104 1040,104 1120,88 L1120,120 L-320,120 Z" fill="url(#wvg)" opacity="0.5"/>
    </g>
  </g>

  <g fill="#fde68a">
    <circle class="tw" cx="420" cy="34" r="2.4"/><circle class="tw2" cx="540" cy="58" r="1.8"/>
    <circle class="tw" cx="760" cy="30" r="2.2"/><circle class="tw2" cx="880" cy="56" r="1.7"/>
    <circle class="tw" cx="300" cy="52" r="1.6"/><circle class="tw2" cx="990" cy="40" r="2"/>
  </g>

  <text class="tw" x="640" y="56" text-anchor="middle" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',Verdana,sans-serif" font-size="26" fill="#fcd34d" letter-spacing="6">ကံကောင်းပါစေ ✨</text>
</svg>
