<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="ရွှေဗေဒင် Shwe Baydin — animated banner">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a24"/>
      <stop offset="0.55" stop-color="#0d1440"/>
      <stop offset="1" stop-color="#1c1046"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fffbeb" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moonG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.6" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="titleClip">
      <text x="640" y="224" text-anchor="middle" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4">ရွှေဗေဒင်</text>
    </clipPath>
  </defs>
  <style>
    .spin { transform-origin: 640px 210px; animation: spin 70s linear infinite; }
    .spinRev { transform-origin: 640px 210px; animation: spinRev 110s linear infinite; }
    .orbit { transform-origin: 640px 210px; animation: spin 140s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinRev { to { transform: rotate(-360deg); } }
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.3s ease-in-out infinite; animation-delay: -1.5s; }
    .tw3 { animation: tw 2.6s ease-in-out infinite; animation-delay: -2.3s; }
    @keyframes tw { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.95; } }
    .drift1 { animation: drift 52s linear infinite; }
    .drift2 { animation: drift 76s linear infinite; animation-delay: -30s; }
    .drift3 { animation: drift 64s linear infinite; animation-delay: -48s; }
    @keyframes drift { from { transform: translateX(-360px); } to { transform: translateX(1460px); } }
    .rise { animation: rise 9s linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translateY(-260px); opacity: 0; } }
    .pulse { transform-origin: 1096px 96px; animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.12); } }
    .shoot { animation: shoot 11s linear infinite; }
    .shoot2 { animation: shoot 15s linear infinite; animation-delay: -6s; }
    @keyframes shoot { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 14% { transform: translateX(-520px); opacity: 0; } 100% { transform: translateX(-520px); opacity: 0; } }
    .floaty { animation: floaty 7s ease-in-out infinite; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .sweep { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-320px) skewX(-18deg); } 55%, 100% { transform: translateX(1620px) skewX(-18deg); } }
    .shimmer { animation: shimmer 4s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 3.8s ease-in-out infinite; }
    @keyframes spark { 0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <rect width="1280" height="420" fill="url(#night)"/>

  <!-- ambient gold glows -->
  <circle cx="200" cy="80" r="260" fill="url(#goldGlow)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.25;0.5" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="360" r="280" fill="url(#goldGlow)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling star field -->
  <g fill="#ffffff">
    <circle class="tw" cx="60" cy="60" r="2.2"/><circle class="tw2" cx="150" cy="160" r="1.5"/>
    <circle class="tw3" cx="250" cy="70" r="2"/><circle class="tw" cx="350" cy="220" r="1.4"/>
    <circle class="tw2" cx="450" cy="50" r="1.8"/><circle class="tw3" cx="540" cy="330" r="1.5"/>
    <circle class="tw" cx="720" cy="60" r="2"/><circle class="tw2" cx="820" cy="180" r="1.4"/>
    <circle class="tw3" cx="920" cy="300" r="1.8"/><circle class="tw" cx="1010" cy="220" r="1.5"/>
    <circle class="tw2" cx="1180" cy="200" r="2.1"/><circle class="tw3" cx="1230" cy="90" r="1.5"/>
    <circle class="tw" cx="90" cy="330" r="1.6"/><circle class="tw2" cx="300" cy="360" r="1.8"/>
    <circle class="tw3" cx="480" cy="120" r="1.3"/><circle class="tw" cx="880" cy="90" r="1.6"/>
    <circle class="tw2" cx="1150" cy="330" r="1.4"/><circle class="tw3" cx="40" cy="200" r="1.7"/>
  </g>
  <g fill="#fde68a">
    <circle class="tw2" cx="200" cy="250" r="2"/><circle class="tw" cx="620" cy="90" r="1.7"/>
    <circle class="tw3" cx="990" cy="140" r="1.9"/><circle class="tw" cx="760" cy="350" r="1.6"/>
    <circle class="tw2" cx="1080" cy="280" r="1.5"/><circle class="tw3" cx="420" cy="290" r="1.7"/>
  </g>

  <!-- 4-point sparkles -->
  <g fill="#fef3c7">
    <path class="spark" style="animation-delay:-1s" transform="translate(330,90)" d="M0,-11 C1.5,-3 3,-1.5 11,0 C3,1.5 1.5,3 0,11 C-1.5,3 -3,1.5 -11,0 C-3,-1.5 -1.5,-3 0,-11 Z"/>
    <path class="spark" style="animation-delay:-2.4s" transform="translate(950,60)" d="M0,-9 C1.2,-2.5 2.5,-1.2 9,0 C2.5,1.2 1.2,2.5 0,9 C-1.2,2.5 -2.5,1.2 -9,0 C-2.5,-1.2 -1.2,-2.5 0,-9 Z"/>
    <path class="spark" style="animation-delay:-0.4s" transform="translate(160,300)" d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8 Z"/>
    <path class="spark" style="animation-delay:-3.1s" transform="translate(1140,250)" d="M0,-10 C1.3,-2.8 2.8,-1.3 10,0 C2.8,1.3 1.3,2.8 0,10 C-1.3,2.8 -2.8,1.3 -10,0 C-2.8,-1.3 -1.3,-2.8 0,-10 Z"/>
  </g>

  <!-- glowing moon, top right -->
  <circle class="pulse" cx="1096" cy="96" r="112" fill="url(#moonGlow)"/>
  <circle cx="1096" cy="96" r="56" fill="url(#moonG)"/>
  <circle cx="1080" cy="82" r="10" fill="#f59e0b" opacity="0.35"/>
  <circle cx="1110" cy="108" r="7" fill="#f59e0b" opacity="0.3"/>
  <circle cx="1092" cy="116" r="5" fill="#f59e0b" opacity="0.28"/>

  <!-- moon phase strip, bottom left -->
  <g class="bob" opacity="0.85">
    <circle cx="96" cy="386" r="11" fill="#fde68a" opacity="0.25"/>
    <circle cx="136" cy="386" r="11" fill="#fde68a" opacity="0.4"/>
    <circle cx="176" cy="386" r="11" fill="#fde68a" opacity="0.55"/>
    <circle cx="216" cy="386" r="11" fill="#fde68a" opacity="0.7"/>
    <circle cx="256" cy="386" r="11" fill="#fde68a" opacity="0.85"/>
    <circle cx="296" cy="386" r="11" fill="#fde68a"/>
    <circle cx="336" cy="386" r="11" fill="#fde68a" opacity="0.85"/>
  </g>

  <!-- rotating zodiac wheel behind title -->
  <g opacity="0.55">
    <circle class="spin" cx="640" cy="210" r="152" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="12 16" opacity="0.75"/>
    <circle class="spinRev" cx="640" cy="210" r="196" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 20" opacity="0.5"/>
    <circle class="spin" cx="640" cy="210" r="152" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="70 400" opacity="0.85" style="animation-duration:24s"/>
  </g>
  <g class="orbit" font-family="'DejaVu Sans','Segoe UI Symbol','Noto Sans Symbols 2',serif" font-size="27" fill="#fcd34d" text-anchor="middle" opacity="0.9">
    <text x="810" y="210" dominant-baseline="central">♈</text>
    <text x="787" y="295" dominant-baseline="central">♉</text>
    <text x="725" y="357" dominant-baseline="central">♊</text>
    <text x="640" y="380" dominant-baseline="central">♋</text>
    <text x="555" y="357" dominant-baseline="central">♌</text>
    <text x="493" y="295" dominant-baseline="central">♍</text>
    <text x="470" y="210" dominant-baseline="central">♎</text>
    <text x="493" y="125" dominant-baseline="central">♏</text>
    <text x="555" y="63" dominant-baseline="central">♐</text>
    <text x="640" y="40" dominant-baseline="central">♑</text>
    <text x="725" y="63" dominant-baseline="central">♒</text>
    <text x="787" y="125" dominant-baseline="central">♓</text>
  </g>

  <!-- drifting golden mist clouds -->
  <g id="mistShape" fill="url(#mist)">
    <ellipse cx="0" cy="0" rx="80" ry="30"/>
    <ellipse cx="52" cy="-16" rx="54" ry="26"/>
    <ellipse cx="-56" cy="-10" rx="48" ry="22"/>
  </g>
  <g transform="translate(0,330)"><g class="drift1"><use href="#mistShape" opacity="0.8"/></g></g>
  <g transform="translate(0,120) scale(0.7)"><g class="drift2"><use href="#mistShape" opacity="0.6"/></g></g>
  <g transform="translate(0,250) scale(1.2)"><g class="drift3"><use href="#mistShape" opacity="0.45"/></g></g>

  <!-- rising gold particles -->
  <g fill="#fde68a">
    <circle class="rise" cx="420" cy="400" r="3.2"/>
    <circle class="rise" style="animation-delay:-2s" cx="560" cy="410" r="2.4"/>
    <circle class="rise" style="animation-delay:-4.5s" cx="720" cy="405" r="3"/>
    <circle class="rise" style="animation-delay:-1s" cx="860" cy="400" r="2.2"/>
    <circle class="rise" style="animation-delay:-6s" cx="480" cy="415" r="2.6"/>
    <circle class="rise" style="animation-delay:-3.2s" cx="800" cy="412" r="2.8"/>
  </g>

  <!-- shooting stars -->
  <g transform="rotate(-22 1050 60)">
    <rect class="shoot" x="980" y="58" width="150" height="3" rx="1.5" fill="url(#streak)"/>
  </g>
  <g transform="rotate(-22 300 140)">
    <rect class="shoot2" x="240" y="138" width="110" height="2.5" rx="1.2" fill="url(#streak)"/>
  </g>

  <!-- floating gold dust near moon -->
  <g class="floaty" fill="#fde68a" opacity="0.8">
    <circle cx="1010" cy="190" r="4"/><circle cx="1180" cy="170" r="3"/><circle cx="1140" cy="30" r="3.4"/>
  </g>

  <!-- hero text -->
  <g text-anchor="middle">
    <text class="shimmer" x="640" y="96" font-family="Verdana,'Segoe UI',system-ui,sans-serif" font-size="20" letter-spacing="8" fill="#fcd34d">✨ AI-POWERED BURMESE HOROSCOPE ✨</text>
    <text x="640" y="224" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#gold)" filter="url(#soft)" opacity="0.55">ရွှေဗေဒင်</text>
    <text x="640" y="224" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="104" font-weight="800" letter-spacing="4" fill="url(#gold)">ရွှေဗေဒင်</text>
    <g clip-path="url(#titleClip)">
      <rect class="sweep" x="0" y="106" width="180" height="140" fill="url(#goldH)" opacity="0.7"/>
    </g>
    <text x="640" y="306" font-family="Verdana,'Segoe UI',system-ui,sans-serif" font-size="30" letter-spacing="14" fill="#e0e7ff">SHWE BAYDIN</text>
    <text x="640" y="350" font-family="'Noto Sans Myanmar','Myanmar Text','Myanmar Sangam MN','Padauk',sans-serif" font-size="29" fill="#c4b5fd" letter-spacing="2">နေ့စဉ်ဟောစာတမ်း • မဟာဘုတ် • အိပ်မက်အဓိပ္ပာယ်</text>
  </g>

  <!-- bottom gold wave -->
  <path d="M0,394 C240,376 420,410 660,396 C900,382 1080,408 1280,392 L1280,420 L0,420 Z" fill="#fbbf24" opacity="0.08"/>
  <path d="M0,404 C260,390 440,416 680,402 C920,388 1100,412 1280,400 L1280,420 L0,420 Z" fill="#fbbf24" opacity="0.06"/>
</svg>
